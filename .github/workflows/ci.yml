name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  data-guard:
    name: Strażnik danych i gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Instalacja gitleaks
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$tarball"
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $tarball\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          sudo install -m 755 gitleaks /usr/local/bin/gitleaks
      - name: Strażnik danych (wszystkie pliki)
        run: scripts/check-no-data.sh --all
      - name: Strażnik danych (każdy commit z PR lub pusha)
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          if [ -n "$PR_BASE" ]; then
            scripts/check-no-data.sh --range "$PR_BASE..$PR_HEAD"
          elif [ -n "$PUSH_BEFORE" ] && ! [[ "$PUSH_BEFORE" =~ ^0+$ ]]; then
            scripts/check-no-data.sh --range "$PUSH_BEFORE..$PUSH_AFTER"
          else
            scripts/check-no-data.sh --range "$PUSH_AFTER"
          fi
      - name: Testy strażnika danych
        run: scripts/tests/check-no-data.test.sh
      - name: gitleaks (cała historia)
        run: gitleaks git --no-banner --redact --config .gitleaks.toml .

  frontend:
    name: Vitest i build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  database:
    name: Testy bazy (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lokalna baza Supabase (migracje)
        run: npx supabase db start
      - name: pgTAP
        run: npx supabase test db
