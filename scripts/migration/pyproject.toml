[project]
name = "marmaapps-migration"
version = "0.1.0"
description = "Jednorazowa migracja danych punktów z dropletu do Supabase (U5)."
requires-python = ">=3.10"
dependencies = [
    "psycopg[binary]==3.2.10",
    "qdrant-client==1.12.2",
    "rethinkdb==2.4.10.post1",
]

[dependency-groups]
dev = ["pytest==8.3.5"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: wymaga lokalnego stacku Supabase (SUPABASE_DB_URL na 127.0.0.1/localhost)",
]
